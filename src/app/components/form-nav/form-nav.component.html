<nav class="form-nav">

  <div
    class="nav-item"
    *ngFor="let item of navItems; let i = index"
    (mouseenter)="onItemEnter(i)"
    (mouseleave)="onItemLeave()">

    <span class="nav-label">
      {{ item.label }}
    </span>


    <!-- Floating submenu -->
    <div
      class="dropdown-menu"
      *ngIf="hasSubmenu(item)"
      [class.visible]="isHovered(i)"
      (mouseenter)="onItemEnter(i)"
      (mouseleave)="onItemLeave()">

      <div
        class="dropdown-item"
        *ngFor="let option of getSubmenu(item)"
        (click)="onSubmenuClick(option)">

        {{ option }}

      </div>

    </div>

  </div>

</nav>
